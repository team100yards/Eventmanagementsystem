      <text x="300" y="678" text-anchor="middle" font-family="'Montserrat', 'Bebas Neue', 'Inter', sans-serif" font-weight="900" font-size="28" fill="#ffffff" letter-spacing="4">100 YARDS</text>
      <!-- Sparkle / Star Icon at Right -->
      <path d="M 480 668 Q 486 668 486 662 Q 486 668 492 668 Q 486 668 486 674 Q 486 668 480 668 Z" fill="#ffffff" stroke="none" />
