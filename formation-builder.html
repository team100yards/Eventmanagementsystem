    const firebaseConfig = {
      apiKey: "...",
      authDomain: "...",
      projectId: "...",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    
    function useFootballForumRoster(collectionName) {
      const [rows, setRows] = useState([]);
      useEffect(() => {
        const unsub = db.collection(collectionName).onSnapshot((snap) => {
          const players = snap.docs.map((doc) => {
            const d = doc.data();
            return `${d.number || "-"}, ${d.name || ""}, ${d.position || "ST"}`;
          });
          setRows(players.join("\n"));
        });
        return () => unsub();
      }, [collectionName]);
      return rows;
    }

    const GROUP = {
      GK: "GK",
      RB: "DEF", LB: "DEF", CB: "DEF", RWB: "DEF", LWB: "DEF",

    };
    const SIDE = {
      GK: "C", RB: "R", LB: "L", CB: "C", RWB: "R", LWB: "L",
      CDM: "C", CM: "C", CAM: "C", RM: "R", LM: "L",
      RW: "R", LW: "L", CF: "C", ST: "C",
    };
    const canonicalize = (raw) => {
      const key = String(raw || "").trim().toUpperCase().replace(/[^A-Z0-9]/g, "");
      if (ALIASES[key]) return ALIASES[key];
      const withoutDigits = key.replace(/\d+/g, "");
      if (ALIASES[withoutDigits]) return ALIASES[withoutDigits];
      if (key.includes("GK") || key.includes("GOAL") || key.includes("KEEP")) return "GK";
      if (key.includes("DEF") || key.includes("BACK")) {
        if (key.includes("LEFT")) return "LB";
        if (key.includes("RIGHT")) return "RB";
        return "CB";
      }
      if (key.includes("MID")) {
        if (key.includes("LEFT")) return "LM";
        if (key.includes("RIGHT")) return "RM";
        if (key.includes("DEF") || key.includes("HOLD")) return "CDM";
        if (key.includes("ATT")) return "CAM";
        return "CM";
      }
      if (key.includes("WING")) return key.includes("LEFT") ? "LW" : "RW";
      if (key.includes("FORW") || key.includes("STRIK") || key.includes("ATT")) return "ST";
      return key || "ST";
    };

    const formatShortName = (raw) => {
      if (!raw) return "";
      const parts = String(raw).trim().split(/\s+/).filter(Boolean);
      if (parts.length <= 1) return raw;
      if (parts.length === 2) return `${parts[0][0]}. ${parts[1]}`;
      return `${parts[0][0]}. ${parts[parts.length - 1]}`;
    };

    const canonicalizePlayer = (p) => {
      if (!p) return null;
      const rawPos = p.rawPosition || p.position || "";
      const canonical = canonicalize(rawPos);
      let group = GROUP[canonical];
      let side = SIDE[canonical];
      if (!group) {
        const u = String(rawPos).toUpperCase();
        if (u.includes("GK") || u.includes("GOAL") || u.includes("KEEP")) { group = "GK"; side = "C"; }
        else if (u.includes("DEF") || u.includes("BACK")) { group = "DEF"; side = u.includes("LEFT") ? "L" : (u.includes("RIGHT") ? "R" : "C"); }
        else if (u.includes("MID")) { group = "MID"; side = u.includes("LEFT") ? "L" : (u.includes("RIGHT") ? "R" : "C"); }
        else if (u.includes("FORW") || u.includes("STRIKE") || u.includes("ATT") || u.includes("WING")) { group = "FWD"; side = u.includes("LEFT") ? "L" : (u.includes("RIGHT") ? "R" : "C"); }
        else { group = "MID"; side = "C"; }
      }
      return {
        id: p.id || `p-${Math.random().toString(36).slice(2, 8)}`,

    const ZONE_SIZE = { GK: [22, 15], DEF: [30, 20], MID: [34, 22], FWD: [30, 22] };


    const getSlotGroup = (slot) => {
      if (!slot) return "MID";
      if (slot.code === "GK" || slot.y >= 88) return "GK";
      if (GROUP[slot.code]) return GROUP[slot.code];
      if (slot.y >= 68) return "DEF";
      if (slot.y >= 35) return "MID";
      return "FWD";
    };

    const getSlotSide = (slot) => {
      if (!slot) return "C";
      if (slot.code === "GK") return "C";
      if (slot.x <= 25) return "L";
      if (slot.x >= 75) return "R";
      if (SIDE[slot.code]) return SIDE[slot.code];
      return "C";
    };

    // Compatibility scoring function: computes how well a player fits a specific formation slot
    const calcCompatibilityScore = (p, slot) => {
      const pCanon = p.canonical || "CM";
      const pGroup = p.group || GROUP[pCanon] || "MID";
      const pSide = p.side || SIDE[pCanon] || "C";

      const sCanon = slot.code;
      const sGroup = getSlotGroup(slot);
      const sSide = getSlotSide(slot);

      // Rule 1: Goalkeeper rules (absolute priority & protection)
      if (sGroup === "GK" || sCanon === "GK") {
        if (pGroup === "GK" || pCanon === "GK") return 1000;
        return -500; // Outfield player in goal is heavily penalized
      }
      if (pGroup === "GK" || pCanon === "GK") {
        return -1000; // Goalkeeper should NEVER play outfield
      }

      // Rule 2: Exact canonical match
      if (pCanon === sCanon) return 100;

      // Rule 3: Natural tactical equivalents
      const EQUIV = {
        LB: ["LWB", "CB", "DF"],
        RB: ["RWB", "CB", "DF"],
        CB: ["SW", "CD", "DEF", "LB", "RB", "CDM"],
        LWB: ["LB", "LM", "LW"],
        RWB: ["RB", "RM", "RW"],
        CDM: ["CM", "CAM", "CB"],
        CM: ["CDM", "CAM", "LM", "RM"],
        CAM: ["CM", "CDM", "CF", "ST", "LM", "RM"],
        LM: ["LW", "LWB", "CM"],
        RM: ["RW", "RWB", "CM"],
        LW: ["LM", "LF", "ST", "CF"],
        RW: ["RM", "RF", "ST", "CF"],
        CF: ["ST", "CAM", "LW", "RW"],
        ST: ["CF", "LW", "RW", "CAM"]
      };
      if (EQUIV[sCanon]) {
        const idx = EQUIV[sCanon].indexOf(pCanon);
        if (idx !== -1) return 92 - (idx * 4);
      }

      // Rule 4: Same positional group
      if (pGroup === sGroup) {
        let score = 65;
        if (pSide === sSide) score += 20; // Same flank (e.g. Left defender in Left Back)
        else if (pSide === "C" || sSide === "C") score += 10; // Central flexibility
        else score -= 15; // Flank mismatch (e.g. Left player in Right slot)
        return score;
      }

      // Rule 5: Adjacent positional line (flexibility)
      if ((pGroup === "DEF" && sGroup === "MID") || (pGroup === "MID" && sGroup === "DEF")) {
        let score = 30;
        if (pSide === sSide) score += 10;
        return score;
      }
      if ((pGroup === "MID" && sGroup === "FWD") || (pGroup === "FWD" && sGroup === "MID")) {
        let score = 30;
        if (pSide === sSide) score += 10;
        return score;
      }

      // Rule 6: Opposite line (DEF <-> FWD)
      return 5;
    };

    function assignTacticalLineup(startersPool, subsPool, slots) {
      if (!slots || !slots.length) return { filled: [], subs: [] };

      const primary = (startersPool || []).map(canonicalizePlayer).filter(Boolean);
      const secondary = (subsPool || []).map(canonicalizePlayer).filter(Boolean);

      let pool = primary.length ? [...primary] : [...secondary];
      let bench = primary.length ? [...secondary] : [];

      const assignments = new Array(slots.length).fill(null);
      const available = [...pool];

      // Iterative global highest-compatibility matching on primary pool
      while (assignments.some((a) => a === null) && available.length > 0) {
        let bestScore = -Infinity;
        let bestSlotIdx = -1;
        let bestPlayerIdx = -1;

        for (let sIdx = 0; sIdx < slots.length; sIdx++) {
          if (assignments[sIdx] !== null) continue;
          const slot = slots[sIdx];
          for (let pIdx = 0; pIdx < available.length; pIdx++) {
            const p = available[pIdx];
            const score = calcCompatibilityScore(p, slot);
            if (score > bestScore) {
              bestScore = score;
              bestSlotIdx = sIdx;
              bestPlayerIdx = pIdx;
            }
          }
        }

        if (bestSlotIdx !== -1 && bestPlayerIdx !== -1) {
          assignments[bestSlotIdx] = available.splice(bestPlayerIdx, 1)[0];
        } else {
          break;
        }
      }

      // If any slots remain unfilled and secondary pool has players, fill from secondary
      if (assignments.some((a) => a === null) && bench.length > 0) {
        while (assignments.some((a) => a === null) && bench.length > 0) {
          let bestScore = -Infinity;
          let bestSlotIdx = -1;
          let bestBenchIdx = -1;

          for (let sIdx = 0; sIdx < slots.length; sIdx++) {
            if (assignments[sIdx] !== null) continue;
            const slot = slots[sIdx];
            for (let bIdx = 0; bIdx < bench.length; bIdx++) {
              const p = bench[bIdx];
              const score = calcCompatibilityScore(p, slot);
              if (score > bestScore) {
                bestScore = score;
                bestSlotIdx = sIdx;
                bestBenchIdx = bIdx;
              }
            }
          }

          if (bestSlotIdx !== -1 && bestBenchIdx !== -1) {
            assignments[bestSlotIdx] = bench.splice(bestBenchIdx, 1)[0];
          } else {
            break;
          }
        }
      }

      // Build filled slots
      const filled = slots.map((slot, i) => ({
        slot,
        player: assignments[i] ? { ...assignments[i], type: "start" } : null,
      }));

      // Combine leftover primary + leftover secondary for the bench
      const allRemaining = [...available, ...bench];
      const orderRank = { GK: 0, DEF: 1, MID: 2, FWD: 3 };
      allRemaining.sort((a, b) => {
        const rA = orderRank[a.group] != null ? orderRank[a.group] : 9;
        const rB = orderRank[b.group] != null ? orderRank[b.group] : 9;
        if (rA !== rB) return rA - rB;
        const nA = parseInt(a.number, 10);
        const nB = parseInt(b.number, 10);
        if (!isNaN(nA) && !isNaN(nB) && nA !== nB) return nA - nB;
        return String(a.name || "").localeCompare(String(b.name || ""));
      });

      const subs = allRemaining.map((p) => ({ ...p, type: "sub" }));

      return { filled, subs };
    }

    function assignToFormation(players, slots) {
      const starters = (players || []).filter((p) => p.type === "start");
      const bench = (players || []).filter((p) => p.type !== "start");
      return assignTacticalLineup(starters, bench, slots);
    }

    function FormationBuilder() {
      const [manualPlayers, setManualPlayers] = useState([]);
      const [formationKey, setFormationKey] = useState("4-3-3");
      const [isFullscreen, setIsFullscreen] = useState(false);
      const [isCoach, setIsCoach] = useState(true);
      const LINE_GROUPS = ["GK", "DEF", "MID", "FWD"];
      const [activeLines, setActiveLines] = useState(LINE_GROUPS);
      const [ballPos, setBallPos] = useState({ x: 50, y: 50 });
      const [panelOpen, setPanelOpen] = useState(true);
      const [customPos, setCustomPos] = useState({});
      const [dragKey, setDragKey] = useState(null);
      const [syncInfo, setSyncInfo] = useState("");
      const pitchRef = useRef(null);
      const [pitchHeight, setPitchHeight] = useState(null);
      const [selectedBenchPlayer, setSelectedBenchPlayer] = useState(null);
      const [draggedBenchId, setDraggedBenchId] = useState(null);

      const formatShortName = (raw) => {
        if (!raw) return "";
        const parts = String(raw).trim().split(/\s+/).filter(Boolean);
        if (parts.length <= 1) return raw;
        if (parts.length === 2) return `${parts[0][0]}. ${parts[1]}`;
        return `${parts[0][0]}. ${parts[parts.length - 1]}`;
      };

      // ---------- Exact Match XI slot data (the source of truth for pitch placement) ----------
      // exactStarters[i] lines up 1:1 with FORMATIONS[syncedFormationKey][i] — this is what
      // guarantees the pitch always matches Match XI exactly, with no re-calculation/mismatch.
      const [exactStarters, setExactStarters] = useState(null);
      const [exactSubs, setExactSubs] = useState(null);
      const [syncedFormationKey, setSyncedFormationKey] = useState(null);
      const [isDirty, setIsDirty] = useState(false); // true once the roster is hand-edited

      const reportHeight = () => {
        try {
          if (window.parent && window.parent !== window) {
            const h = document.documentElement.scrollHeight;
            window.parent.postMessage({ type: "ff-height", height: h }, "*");
          }
        } catch (e) { }
      };

      // Builds a pitch layout (x/y per slot) for ANY formation given just its role/count
      // definition (e.g. [{r:'GK',n:1},{r:'DEF',n:4},{r:'MID',n:4},{r:'FWD',n:2}]) — this is
      // what lets custom formations from Match XI render here even though they're not one of
      // the 6 built-in shapes.
      const autoLayoutFormation = (def) => {
        const roleCode = { GK: "GK", DEF: "CB", MID: "CM", FWD: "ST" };
        const lines = (def || []).filter((l) => l && l.n > 0);
        const outfield = lines.length - 1;
        const slots = [];
        lines.forEach((line, li) => {
          let y;
          if (li === 0) y = 93;
          else if (outfield <= 1) y = 45;
          else y = 76 - (li - 1) * (64 / (outfield - 1));
          const n = line.n;
          for (let i = 0; i < n; i++) {
            const x = 8 + (84 / (n + 1)) * (i + 1);
            const code = roleCode[line.r] || "CM";
            slots.push({ code, label: line.lbl || code, x, y });
          }
        });
        return slots;
      };

      // ---------- Sync roster from the Football Forum parent app (Match XI: playing 11 + subs + management) ----------
      const applySyncPayload = (data) => {
        if (!data) return;
        if (typeof data.isCoach === "boolean") {
          setIsCoach(data.isCoach);
        }
        if (data.formation && !FORMATIONS[data.formation] && data.formationDef) {
          FORMATIONS[data.formation] = autoLayoutFormation(data.formationDef);
        }
        setCustomPos((data.customPos && typeof data.customPos === "object") ? data.customPos : {});
        setBallPos((data.ballPos && typeof data.ballPos === "object" && data.ballPos.x != null) ? data.ballPos : { x: 50, y: 50 });
        if (data.formation && FORMATIONS[data.formation]) {
          setFormationKey(data.formation);
        }
        if (data.starters) {
          // Exact per-slot data from a saved Match XI squad — preserves placement exactly.
          setExactStarters(data.starters);
          setExactSubs(data.subs || []);
          setSyncedFormationKey(data.formation && FORMATIONS[data.formation] ? data.formation : null);
          const startRows = [];
          data.starters.forEach((p) => { if (p) startRows.push({ ...p, type: "start" }); });
          const subRows = (data.subs || []).map((p) => ({ ...p, type: "sub" }));
          const flat = [...startRows, ...subRows];
          setManualPlayers(flat.map((p) => ({
            id: p.id || `sync-${Math.random().toString(36).slice(2, 8)}`,
            name: p.name || "",
            displayName: p.displayName || p.shortName || formatShortName(p.name),
            shortName: p.shortName || p.displayName || formatShortName(p.name),
            number: (p.number != null && p.number !== "") ? String(p.number) : ((p.jersey != null && p.jersey !== "") ? String(p.jersey) : "-"),
            position: p.position || "ST",
            type: p.type,
          })));
        } else {
          // No saved Match XI squad — fell back to the full player database (flat list only).
          // Split it the same way the pitch would: first N (formation size) as Playing XI, rest as Substitutes.
          setExactStarters(null);
          setExactSubs(null);
          setSyncedFormationKey(null);
          const startCount = (FORMATIONS[data.formation || formationKey] || FORMATIONS["4-3-3"]).length;
          const incoming = (data.players || []).map((p, idx) => ({
            id: p.id || `sync-${Math.random().toString(36).slice(2, 8)}`,
            name: p.name || "",
            displayName: p.displayName || p.shortName || formatShortName(p.name),
            shortName: p.shortName || p.displayName || formatShortName(p.name),
            number: (p.number != null && p.number !== "") ? String(p.number) : ((p.jersey != null && p.jersey !== "") ? String(p.jersey) : "-"),
            position: p.position || "ST",
            type: idx < startCount ? "start" : "sub",
          }));
          setManualPlayers(incoming);
        }
        setIsDirty(false);
        setPanelOpen(true);
        setSyncInfo(data.source || "Synced from Football Forum");
        setTimeout(reportHeight, 50);
        setTimeout(reportHeight, 300);
      };

      useEffect(() => {
        const handleMessage = (e) => {
          const data = e.data;
          if (!data || typeof data !== "object") return;
          if (data.type === "ff-sync") applySyncPayload(data);
          if (data.type === "ff-chat-sync" && typeof data.isCoach === "boolean") {
            setIsCoach(data.isCoach);
          }
        };
        window.addEventListener("message", handleMessage);
        // First load cached team formation from localStorage if available
        try {
          const cached = localStorage.getItem('ems_active_formation_payload');
          if (cached) {
            const parsed = JSON.parse(cached);
            if (parsed && typeof parsed === 'object') {
              applySyncPayload(parsed);
            }
          }
        } catch (e) { }

        // Let the parent / opener app know we're mounted and ready to receive the roster
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: "ff-ready" }, "*");
          }
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({ type: "ff-ready" }, "*");
          }
        } catch (e) { }
        reportHeight();
        const ro = new ResizeObserver(() => reportHeight());
        ro.observe(document.documentElement);
        window.addEventListener("resize", reportHeight);
        const t1 = setTimeout(reportHeight, 300);
        const t2 = setTimeout(reportHeight, 1000);
        return () => {
          window.removeEventListener("message", handleMessage);
          window.removeEventListener("resize", reportHeight);
          ro.disconnect();
          clearTimeout(t1);
          clearTimeout(t2);
        };
      }, []);

      const requestResync = () => {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: "ff-request-sync" }, "*");
          }
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({ type: "ff-request-sync" }, "*");
          }
        } catch (e) { }
        try {
          const cached = localStorage.getItem('ems_active_formation_payload');
          if (cached) {
            const parsed = JSON.parse(cached);
            if (parsed && typeof parsed === 'object') {
              applySyncPayload(parsed);
            }
          }
        } catch (e) { }
      };

      const toggleFullscreen = () => {
        const el = document.documentElement;
        if (!document.fullscreenElement) {
          (el.requestFullscreen || el.webkitRequestFullscreen || (() => { })).call(el);
        } else {
          (document.exitFullscreen || document.webkitExitFullscreen || (() => { })).call(document);
        }
      };

      useEffect(() => {
        const onFsChange = () => setIsFullscreen(!!document.fullscreenElement);
        document.addEventListener("fullscreenchange", onFsChange);
        document.addEventListener("webkitfullscreenchange", onFsChange);
        return () => {
          document.removeEventListener("fullscreenchange", onFsChange);
          document.removeEventListener("webkitfullscreenchange", onFsChange);
        };
      }, []);

      useEffect(() => {
        const updatePitchHeight = () => {
          if (pitchRef.current) {
            const h = pitchRef.current.getBoundingClientRect().height;
            if (h > 50) setPitchHeight(Math.round(h));
          }
        };
        updatePitchHeight();
        const ro = new ResizeObserver(() => {
          requestAnimationFrame(updatePitchHeight);
        });
        if (pitchRef.current) ro.observe(pitchRef.current);
        window.addEventListener("resize", updatePitchHeight);
        document.addEventListener("fullscreenchange", updatePitchHeight);
        document.addEventListener("webkitfullscreenchange", updatePitchHeight);
        const t1 = setTimeout(updatePitchHeight, 50);
        const t2 = setTimeout(updatePitchHeight, 250);
        const t3 = setTimeout(updatePitchHeight, 600);
        return () => {
          ro.disconnect();
          window.removeEventListener("resize", updatePitchHeight);
          document.removeEventListener("fullscreenchange", updatePitchHeight);
          document.removeEventListener("webkitfullscreenchange", updatePitchHeight);
          clearTimeout(t1);
          clearTimeout(t2);
          clearTimeout(t3);
        };
      }, [formationKey, isFullscreen]);

      const updateManualRow = (id, field, value) => {
        setIsDirty(true);
        setManualPlayers((prev) => prev.map((p) => (p.id === id ? { ...p, [field]: value } : p)));
      };

      const addManualRow = (type) => {
        setIsDirty(true);
        setManualPlayers((prev) => [
          ...prev,
          { id: `m-${Math.random().toString(36).slice(2, 8)}`, name: "", number: String(prev.length + 1), position: "ST", type: type || "sub" },
        ]);
      };

      const removeManualRow = (id) => {
        setIsDirty(true);
        setManualPlayers((prev) => prev.filter((p) => p.id !== id));
      };

      const manualPlayersParsed = useMemo(() => {
        return manualPlayers
          .filter((p) => p.name.trim())
          .map((p) => canonicalizePlayer({ ...p, name: p.name.trim() }));
      }, [manualPlayers]);

      const players = manualPlayersParsed;
      const slots = FORMATIONS[formationKey];

      const { filled, subs } = useMemo(() => {
        const curSlots = FORMATIONS[formationKey] || FORMATIONS["4-3-3"];

        // If the coach manually swapped or edited players in the studio, preserve their explicit slot placements
        if (isDirty && exactStarters && exactStarters.length) {
          const filledSlots = curSlots.map((slot, i) => {
            const p = exactStarters[i] || null;
            return {
              slot,
              player: p ? canonicalizePlayer({ ...p, type: "start" }) : null
            };
          });
          const remainingSubs = (exactSubs || []).map((p) => canonicalizePlayer({ ...p, type: "sub" })).filter(Boolean);
          return { filled: filledSlots, subs: remainingSubs };
        }

        // On team load, formation switch, or auto-layout:
        // Use our intelligent tactical assignment engine to place each player into their optimal pitch position
        let startersPool = [];
        let subsPool = [];

        if (exactStarters && exactStarters.length) {
          startersPool = exactStarters.map((p) => canonicalizePlayer({ ...p, type: "start" })).filter(Boolean);
          subsPool = (exactSubs || []).map((p) => canonicalizePlayer({ ...p, type: "sub" })).filter(Boolean);
        } else if (players && players.length) {
          startersPool = players.filter((p) => p.type === "start");
          subsPool = players.filter((p) => p.type !== "start");
          if (!startersPool.length) {
            startersPool = [...players];
            subsPool = [];
          }
        }

        return assignTacticalLineup(startersPool, subsPool, curSlots);
      }, [players, slots, exactStarters, exactSubs, isDirty, formationKey]);

      const swapBenchWithStarter = (benchPlayer, starterIndex) => {
        if (!benchPlayer) return;
        const starterToReplace = filled[starterIndex]?.player;

        let newStarters = filled.map((f, idx) => {
          if (idx === starterIndex) {
            return canonicalizePlayer({ ...benchPlayer, type: "start" });
          }
          return f.player ? canonicalizePlayer({ ...f.player, type: "start" }) : null;
        });

        let newSubs = (subs || []).filter((p) => p && (p.id !== benchPlayer.id && p.name !== benchPlayer.name));
        if (starterToReplace) {
          newSubs.unshift(canonicalizePlayer({ ...starterToReplace, type: "sub" }));
        }

        setExactStarters(newStarters);
        setExactSubs(newSubs);
        setIsDirty(true);

        const flat = [
          ...newStarters.filter(Boolean).map((p) => ({ ...p, type: "start" })),
          ...newSubs.filter(Boolean).map((p) => ({ ...p, type: "sub" }))
        ];
        setManualPlayers(flat.map((p) => ({
          id: p.id || `sync-${Math.random().toString(36).slice(2, 8)}`,
          name: p.name || "",
          displayName: p.displayName || p.shortName || formatShortName(p.name),
          shortName: p.shortName || p.displayName || formatShortName(p.name),
          number: (p.number != null && p.number !== "") ? String(p.number) : ((p.jersey != null && p.jersey !== "") ? String(p.jersey) : "-"),
          position: p.rawPosition || p.position || "ST",
          type: p.type
        })));

        setSelectedBenchPlayer(null);
        setDraggedBenchId(null);

        try {
          const payload = {
            formation: formationKey,
            starters: newStarters,
            subs: newSubs,
            customPos,
            ballPos
          };
          localStorage.setItem('ems_active_formation_payload', JSON.stringify(payload));
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: "ff-lineup-updated", starters: newStarters, subs: newSubs }, "*");
          }
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({ type: "ff-lineup-updated", starters: newStarters, subs: newSubs }, "*");
          }
        } catch (e) { }
      };

    const handlePrint = () => window.print();

    const getSlotKey = (i) => `${formationKey}::${i}`;
    const getPos = (slot, i) => customPos[getSlotKey(i)] || { x: slot.x, y: slot.y };
    const toggleLine = (g) => {
      setActiveLines((prev) => {
        if (prev.includes(g)) {
          if (prev.length === 1) return prev; // keep at least one line visible
          return prev.filter((x) => x !== g);
        }
        return [...prev, g];
      });
    };

    const saveVisualizerPositions = (newCustomPos, newBallPos, key) => {
      if (!isCoach) return;
      try {
        if (window.parent && window.parent !== window) {
          window.parent.postMessage({
            type: "ff-visualizer-save",
            customPos: newCustomPos || customPos,
            ballPos: newBallPos || ballPos,
            formationKey: key || formationKey
          }, "*");
        }
      } catch (e) { }
    };

    const resetPositions = () => {
      setIsDirty(false);
      setCustomPos((prev) => {
        const next = { ...prev };
        Object.keys(next).forEach((k) => {
          if (k.startsWith(`${formationKey}::`)) delete next[k];
        });
        saveVisualizerPositions(next, ballPos, formationKey);
        return next;
      });
    };

    const onFormationChange = (newKey) => {
      setFormationKey(newKey);
      setIsDirty(false);
      saveVisualizerPositions(customPos, ballPos, newKey);
    };

    useEffect(() => {
      if (!dragKey) return;
      const clamp = (v) => Math.max(3, Math.min(97, v));
      let curCustom = customPos;
      let curBall = ballPos;
      const handleMove = (e) => {
        if (!pitchRef.current) return;
        const rect = pitchRef.current.getBoundingClientRect();
        const point = e.touches ? e.touches[0] : e;
        const x = clamp(((point.clientX - rect.left) / rect.width) * 100);
        const y = clamp(((point.clientY - rect.top) / rect.height) * 100);
        if (dragKey === "ball") {
          curBall = { x, y };
          setBallPos(curBall);
        } else {
          curCustom = { ...curCustom, [dragKey]: { x, y } };
          setCustomPos(curCustom);
        }
      };
      const handleUp = () => {
        setDragKey(null);
        if (isCoach) {
          saveVisualizerPositions(curCustom, curBall, formationKey);
        }
      };
      window.addEventListener("pointermove", handleMove);
      window.addEventListener("pointerup", handleUp);
      window.addEventListener("touchmove", handleMove, { passive: false });
      window.addEventListener("touchend", handleUp);
      return () => {
        window.removeEventListener("pointermove", handleMove);
        window.removeEventListener("pointerup", handleUp);
        window.removeEventListener("touchmove", handleMove);
        window.removeEventListener("touchend", handleUp);
      };
    }, [dragKey, isCoach, formationKey, customPos, ballPos]);

    const C = {
      bg: "#0F1B14",
      panel: "#132B1C",
      border: "#3A5A44",
      cream: "#F4F1E8",
      creamSoft: "#DCE8DE",
      sage: "#8FBF9F",
      amber: "#E8B34C",
      ink: "#132B1C",
    };

    return (
      <div className="w-full" style={{ background: C.bg, fontFamily: "'Inter', sans-serif" }}>
        <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@600&display=swap');
        .oswald { font-family: 'Oswald', sans-serif; }
        .mono { font-family: 'JetBrains Mono', monospace; }
        .pitch-stripe { background-image: repeating-linear-gradient(to bottom, #1E4D2B 0, #1E4D2B 9.09%, #21532F 9.09%, #21532F 18.18%); }
        .token { transition: transform .15s ease; }
        .token:hover { transform: translate(-50%, -50%) scale(1.08); }
        .roster-toggle:hover { background: #1E4D2B; }
        .roster-input:focus { outline: none; border-color: #E8B34C; }
        .mode-tab { transition: background .15s ease, color .15s ease; }
        @media print {
          body { background: white; }
          .no-print { display: none !important; }
          .print-grid { display: block !important; }
          .print-pitch-wrap { max-width: 480px; margin: 0 auto; }
          .print-title { display: block !important; }
        }
        .chat-scroll {
          scrollbar-width: thin;
          scrollbar-color: #3A5A44 rgba(19, 43, 28, 0.5);
        }
        .chat-scroll::-webkit-scrollbar {
          width: 6px;
        }
        .chat-scroll::-webkit-scrollbar-track {
          background: rgba(19, 43, 28, 0.5);
        }
        .chat-scroll::-webkit-scrollbar-thumb {
          background: #3A5A44;
          border-radius: 3px;
        }
        .chat-scroll::-webkit-scrollbar-thumb:hover {
          background: #8FBF9F;
        }
      `}</style>

        <div className="max-w-6xl mx-auto px-4 sm:px-6 lg:px-10 py-6 md:py-8">
          <div className="flex items-baseline justify-between mb-4 flex-wrap gap-2 no-print">
            <div>
              <div className="oswald" style={{ fontSize: 12, letterSpacing: "0.3em", color: C.sage, marginBottom: 2 }}>SQUAD SHEET</div>
              <h1 className="oswald text-3xl md:text-4xl" style={{ color: C.cream, fontWeight: 600, letterSpacing: "0.02em" }}>Line-Up Builder</h1>
            </div>
            <div className="flex gap-2 flex-wrap">
              {(() => {
                try {
                  const listStr = localStorage.getItem('ems_teams_list');
                  const list = listStr ? JSON.parse(listStr) : [];
                  if (list && list.length > 0) {
                    return (
                      <select
                        onChange={(e) => {
                          const tId = e.target.value;
                          if (!tId) return;
                          try {
                            if (window.parent && window.parent !== window) window.parent.postMessage({ type: "ff-select-team", teamId: tId }, "*");
                            if (window.opener && !window.opener.closed) window.opener.postMessage({ type: "ff-select-team", teamId: tId }, "*");
                          } catch (err) { }
                        }}
                        className="oswald"
                        style={{ fontSize: 13, letterSpacing: "0.02em", padding: "6px 12px", borderRadius: 6, border: `1px solid ${C.border}`, color: C.cream, background: C.bg, fontWeight: 600, cursor: "pointer" }}
                      >
                        <option value="">🏟️ Switch Team…</option>
                        {list.map(t => (
                          <option key={t.id} value={t.id}>🏟️ {t.name}</option>
                        ))}
                      </select>
                    );
                  }
                } catch (e) { }
                return null;
              })()}
              <button
                onClick={requestResync}
                className="oswald"
                style={{ fontSize: 13, letterSpacing: "0.02em", padding: "7px 14px", borderRadius: 6, border: `1px solid ${C.border}`, color: C.creamSoft, background: "transparent", fontWeight: 600, cursor: "pointer" }}
              >
                🔄 Sync from Match XI
              </button>
              <button
                onClick={handlePrint}
                className="oswald"
                style={{ fontSize: 13, letterSpacing: "0.02em", padding: "7px 14px", borderRadius: 6, border: "none", color: C.ink, background: C.amber, fontWeight: 600, cursor: "pointer" }}
              >
                Print formation
              </button>
            </div>
          </div>

          {syncInfo && (
            <div className="no-print" style={{ fontSize: 12, color: C.sage, background: C.panel, border: `1px solid ${C.border}`, borderRadius: 6, padding: "8px 12px", marginBottom: 14, display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
              <span>✅ {syncInfo}</span>
            </div>
          )}

          <div className="print-title" style={{ display: "none" }}>
            <h1 className="oswald" style={{ fontSize: 26, color: "#132B1C", fontWeight: 700, textAlign: "center", marginBottom: 12 }}>
              FORMATION: {formationKey}
            </h1>
          </div>

          {/* TOP TOOLBAR: Controls & Settings spanning the full width above Pitch & Chat */}
          <div className="no-print" style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 10, padding: "10px 14px", marginBottom: 16 }}>
            <div className="flex items-center justify-between flex-wrap gap-3">
              <div className="flex items-center gap-2 flex-wrap">
                <button
                  onClick={resetPositions}
                  className="oswald"
                  style={{ fontSize: 12, letterSpacing: "0.02em", color: C.sage, background: "transparent", border: `1px solid ${C.border}`, borderRadius: 6, padding: "6px 10px", cursor: "pointer" }}
                >
                  Reset positions
                </button>
                <select
                  value={formationKey}
                  onChange={(e) => onFormationChange(e.target.value)}
                  className="oswald"
                  style={{ background: C.bg, color: C.cream, border: `1px solid ${C.border}`, borderRadius: 6, padding: "6px 10px", fontSize: 13, letterSpacing: "0.02em" }}
                >
                  {Object.keys(FORMATIONS).map((k) => (
                    <option key={k} value={k}>{k}</option>
                  ))}
                </select>
                <div className="flex items-center gap-1 flex-wrap">
                  {LINE_GROUPS.map((g) => {
                    const on = activeLines.includes(g);
                    const color = ZONE_COLORS[g];
                    const labels = { GK: "GK", DEF: "DEF", MID: "MID", FWD: "FWD" };
                    return (
                      <button
                        key={g}
                        onClick={() => toggleLine(g)}
                        className="oswald"
                        style={{
                          fontSize: 11.5, letterSpacing: "0.02em", fontWeight: 700, padding: "5px 8px", borderRadius: 6,
                          border: `1px solid ${on ? color : C.border}`,
                          background: on ? hexToRgba(color, 0.28) : "transparent",
                          color: on ? C.cream : C.sage,
                          cursor: "pointer",
                        }}
                      >
                        {labels[g]}
                      </button>
                    );
                  })}
                </div>
              </div>

              <div className="flex items-center gap-3 flex-wrap">
                <button
                  onClick={toggleFullscreen}
                  className="oswald"
                  style={{ fontSize: 12, letterSpacing: "0.02em", fontWeight: 700, color: C.ink, background: C.amber, border: "none", borderRadius: 6, padding: "6px 12px", cursor: "pointer" }}
                >
                  {isFullscreen ? "⤡ Exit Full Screen" : "⛶ Full Screen"}
                </button>
              </div>
            </div>
            <div className="oswald" style={{ fontSize: 11, color: "rgba(143,191,159,0.75)", marginTop: 6, letterSpacing: "0.02em" }}>
              Drag any jersey or the ball to fine-tune positions. Drag bench players onto the pitch or tap to swap into the Starting XI.
            </div>
          </div>

          {/* SYMMETRIC STAGE: FOOTBALL GROUND (Left) & BENCH / GAME CHANGERS (Right) */}
          <div
            className="grid grid-cols-1 md:grid-cols-2 gap-6 print-grid mb-8"
            style={{ alignItems: "start" }}
          >
            {/* LEFT: THE FOOTBALL GROUND (Pitch) */}
            <div
              className="print-pitch-wrap w-full flex flex-col justify-start"
              style={{
                maxWidth: "100%",
                margin: "0 auto",
                ...(isFullscreen ? { maxHeight: "calc(100vh - 140px)", display: "flex", alignItems: "center" } : {})
              }}
            >
              <div
                ref={pitchRef}
                className="relative w-full rounded-lg overflow-hidden pitch-stripe"
                style={{
                  aspectRatio: "68 / 100",
                  maxHeight: isFullscreen ? "calc(100vh - 140px)" : "none",
                  maxWidth: isFullscreen ? "calc((100vh - 140px) * 0.68)" : "100%",
                  border: `2px solid rgba(220,232,222,0.7)`,
                  touchAction: "none",
                  width: "100%",
                  boxSizing: "border-box",
                  margin: "0 auto"
                }}
              >
                {/* pitch markings */}
                <svg
                  viewBox="0 0 68 100"
                  preserveAspectRatio="none"
                  className="absolute inset-0 w-full h-full"
                  style={{ pointerEvents: "none" }}
                >
                  <g fill="none" stroke="rgba(244,241,232,0.55)" strokeWidth="0.35">
                    <rect x="1" y="1" width="66" height="98" />
                    <line x1="1" y1="50" x2="67" y2="50" />
                    <circle cx="34" cy="50" r="9.15" />
                    <circle cx="34" cy="50" r="0.4" fill="rgba(244,241,232,0.55)" />
                    {/* top penalty box + six-yard box (attacking end) */}
                    <rect x="13.85" y="1" width="40.3" height="16.5" />
                    <rect x="24.84" y="1" width="18.32" height="5.5" />
                    <circle cx="34" cy="12" r="0.4" fill="rgba(244,241,232,0.55)" />
                    <path d="M 26.69,17.5 A 9.15,9.15 0 0 0 41.31,17.5" />
                    {/* bottom penalty box + six-yard box (goalkeeper end) */}
                    <rect x="13.85" y="82.5" width="40.3" height="16.5" />
                    <rect x="24.84" y="93.5" width="18.32" height="5.5" />
                    <circle cx="34" cy="88" r="0.4" fill="rgba(244,241,232,0.55)" />
                    <path d="M 26.69,82.5 A 9.15,9.15 0 0 1 41.31,82.5" />
                    {/* corner arcs */}
                    <path d="M 1,3 A 2,2 0 0 0 3,1" />
                    <path d="M 65,1 A 2,2 0 0 0 67,3" />
                    <path d="M 67,97 A 2,2 0 0 0 65,99" />
                    <path d="M 3,99 A 2,2 0 0 0 1,97" />
                  </g>
                </svg>

                {/* players */}
                {filled.map(({ slot, player }, i) => {
                  const pos = getPos(slot, i);
                  const key = getSlotKey(i);
                  const dragging = dragKey === key;
                  const code = player ? player.canonical : slot.code;
                  const group = GROUP[code] || "MID";
                  const groupColor = CODE_COLORS[code] || ZONE_COLORS[group];
                  const dimmed = !activeLines.includes(group);
                  const displayName = player ? (player.displayName || player.shortName || formatShortName(player.name)) : slot.label;
                  const isTargetForSwap = selectedBenchPlayer != null;

                  return (
                    <div
                      key={`slot-${i}`}
                      className="token absolute flex flex-col items-center"
                      onPointerDown={(e) => {
                        if (selectedBenchPlayer) return;
                        e.preventDefault();
                        setDragKey(key);
                      }}
                      onTouchStart={(e) => {
                        if (selectedBenchPlayer) return;
                        e.preventDefault();
                        setDragKey(key);
                      }}
                      onClick={() => {
                        if (selectedBenchPlayer) {
                          swapBenchWithStarter(selectedBenchPlayer, i);
                        }
                      }}
                      onDragOver={(e) => {
                        e.preventDefault();
                      }}
                      onDrop={(e) => {
                        e.preventDefault();
                        const pId = e.dataTransfer.getData("text/plain") || draggedBenchId;
                        const bPlayer = subs.find(x => x.id === pId);
                        if (bPlayer) swapBenchWithStarter(bPlayer, i);
                      }}
                      style={{
                        left: `${pos.x}%`,
                        top: `${pos.y}%`,
                        transform: "translate(-50%,-50%)",
                        cursor: isTargetForSwap ? "pointer" : (dragging ? "grabbing" : "grab"),
                        zIndex: dragging ? 20 : 10,
                        userSelect: "none",
                        opacity: dimmed ? 0.25 : 1,
                        padding: isTargetForSwap ? "6px" : "2px",
                        borderRadius: "14px",
                        background: isTargetForSwap ? "rgba(232,179,76,0.2)" : "transparent",
                        border: isTargetForSwap ? "2px dashed #E8B34C" : "none",
                        transition: "all 0.15s ease",
                        animation: isTargetForSwap ? "pulse 1.4s infinite" : "none"
                      }}
                    >
                      <svg width="68" height="68" viewBox="0 0 64 64" style={{ filter: "drop-shadow(0 2px 5px rgba(0,0,0,0.55))", pointerEvents: "none" }}>
                        <path
                          d="M20,6 L8,14 L14,26 L20,22 L20,58 L44,58 L44,22 L50,26 L56,14 L44,6 L38,10 Q32,16 26,10 Z"
                          fill={player ? C.cream : "rgba(244,241,232,0.25)"}
                          stroke={groupColor}
                          strokeWidth="2.8"
                          strokeLinejoin="round"
                        />
                        <text
                          x="32" y="41"
                          textAnchor="middle"
                          fontSize="22"
                          fontWeight="800"
                          fill={C.ink}
                          style={{ fontFamily: "'JetBrains Mono', monospace" }}
                        >
                          {player ? player.number : "–"}
                        </text>
                      </svg>
                      <div
                        className="oswald text-center leading-tight truncate font-bold"
                        style={{ fontSize: 13, color: C.cream, marginTop: 4, maxWidth: 96, pointerEvents: "none", textShadow: "0 1px 3px rgba(0,0,0,0.9)" }}
                      >
                        {displayName}
                      </div>
                      <div style={{ fontSize: 10, color: groupColor, letterSpacing: "0.02em", pointerEvents: "none", fontWeight: 700 }}>{player ? player.canonical : slot.label}</div>
                    </div>
                  );
                })}

                {/* floating ball */}
                <div
                  onPointerDown={(e) => {
                    e.preventDefault();
                    setDragKey("ball");
                  }}
                  onTouchStart={(e) => {
                    e.preventDefault();
                    setDragKey("ball");
                  }}
                  className="absolute"
                  style={{
                    left: `${ballPos.x}%`,
                    top: `${ballPos.y}%`,
                    transform: "translate(-50%,-50%)",
                    cursor: dragKey === "ball" ? "grabbing" : "grab",
                    zIndex: 30,
                    userSelect: "none",
                  }}
                >
                  <svg width="28" height="28" viewBox="0 0 100 100" style={{ filter: "drop-shadow(0 2px 3px rgba(0,0,0,0.5))", pointerEvents: "none" }}>
                    <defs>
                      <clipPath id="ballClip">
                        <circle cx="50" cy="50" r="47" />
                      </clipPath>
                    </defs>
                    <circle cx="50" cy="50" r="47" fill="#FFFFFF" stroke="#111111" strokeWidth="3" />
                    <g clipPath="url(#ballClip)">
                      <g stroke="#111111" strokeWidth="1.6" fill="none">
                        <line x1="50" y1="36" x2="50" y2="3" />
                        <line x1="63.31" y1="45.67" x2="94.7" y2="35.47" />
                        <line x1="58.23" y1="61.33" x2="77.62" y2="88.03" />
                        <line x1="41.77" y1="61.33" x2="22.38" y2="88.03" />
                        <line x1="36.69" y1="45.67" x2="5.3" y2="35.47" />
                      </g>
                      <g fill="#111111" stroke="#111111" strokeWidth="1.2" strokeLinejoin="round">
                        <polygon points="50,36 63.31,45.67 58.23,61.33 41.77,61.33 36.69,45.67" />
                        <polygon points="50,1 58.56,7.22 55.29,17.29 44.71,17.29 41.44,7.22" />
                        <polygon points="88.04,28.64 96.6,34.86 93.33,44.93 82.75,44.93 79.48,34.86" />
                        <polygon points="73.51,73.36 82.07,79.58 78.8,89.65 68.22,89.65 64.95,79.58" />
                        <polygon points="26.49,73.36 35.05,79.58 31.78,89.65 21.2,89.65 17.93,79.58" />
                        <polygon points="11.96,28.64 20.52,34.86 17.25,44.93 6.67,44.93 3.4,34.86" />
                      </g>
                    </g>
                  </svg>
                </div>
              </div>
            </div>

            {/* RIGHT: BENCH / GAME CHANGERS PANEL (Exact equal height to Pitch) */}
            <div
              className="no-print flex flex-col"
              style={{
                background: C.panel,
                border: `1px solid ${C.border}`,
                borderRadius: 10,
                overflow: "hidden",
                height: pitchHeight ? `${pitchHeight}px` : "100%",
                maxHeight: pitchHeight ? `${pitchHeight}px` : "none",
                minHeight: pitchHeight ? `${pitchHeight}px` : "100%",
                boxSizing: "border-box"
              }}
            >
              {/* Bench Header */}
              <div className="flex items-center justify-between px-4 py-3 border-b flex-shrink-0" style={{ borderColor: C.border, background: "rgba(19,43,28,0.85)" }}>
                <div className="flex items-center gap-2">
                  <span style={{ fontSize: 18 }}>💺</span>
                  <div>
                    <div className="oswald" style={{ fontSize: 14, letterSpacing: "0.15em", color: C.cream, fontWeight: 700 }}>
                      BENCH / GAME CHANGERS ({subs.length})
                    </div>
                    <div style={{ fontSize: 11, color: C.sage }}>
                      Drag &amp; drop onto pitch or tap to swap with Starting XI
                    </div>
                  </div>
                </div>
              </div>

              {/* Active Swap Selection Banner */}
              {selectedBenchPlayer && (
                <div className="px-4 py-2 border-b flex items-center justify-between flex-shrink-0" style={{ borderColor: C.amber, background: "rgba(232,179,76,0.18)" }}>
                  <div className="flex items-center gap-2">
                    <span>🔄</span>
                    <div style={{ fontSize: 12, color: C.cream }}>
                      Selected: <strong style={{ color: C.amber }}>#{selectedBenchPlayer.number} {selectedBenchPlayer.displayName || selectedBenchPlayer.name}</strong>. Tap any player on pitch to swap!
                    </div>
                  </div>
                  <button onClick={() => setSelectedBenchPlayer(null)} style={{ background: "none", border: "none", color: C.sage, cursor: "pointer", fontSize: 12 }}>✕ Cancel</button>
                </div>
              )}

              {/* Bench Scrollable Player Stream */}
              <div className="chat-scroll flex-1 overflow-y-auto p-3 flex flex-col gap-2" style={{ minHeight: 0 }}>
                {subs.length === 0 ? (
                  <div className="m-auto text-center py-8" style={{ color: C.sage }}>
                    <div style={{ fontSize: 32, marginBottom: 6 }}>💺</div>
                    <div className="oswald" style={{ fontSize: 14, color: C.creamSoft }}>No players on the bench</div>
                    <div style={{ fontSize: 11.5, marginTop: 4, opacity: 0.8 }}>All available squad players are currently in the starting XI.</div>
                  </div>
                ) : (
                  subs.map((p) => {
                    const isSelected = selectedBenchPlayer?.id === p.id;
                    const dispName = p.displayName || p.shortName || formatShortName(p.name);
                    const code = canonicalize(p.rawPosition || p.position);
                    const group = GROUP[code] || "MID";
                    const groupColor = CODE_COLORS[code] || ZONE_COLORS[group];

                    return (
                      <div
                        key={p.id}
                        draggable={true}
                        onDragStart={(e) => {
                          e.dataTransfer.setData("text/plain", p.id);
                          setDraggedBenchId(p.id);
                        }}
                        onClick={() => setSelectedBenchPlayer(isSelected ? null : p)}
                        className="flex items-center justify-between p-2.5 rounded-lg transition-all"
                        style={{
                          background: isSelected ? "rgba(232,179,76,0.22)" : "rgba(30,77,43,0.45)",
                          border: `1.5px solid ${isSelected ? C.amber : C.border}`,
                          cursor: "grab",
                          boxShadow: isSelected ? "0 0 10px rgba(232,179,76,0.3)" : "none"
                        }}
                        title="Drag to pitch or click to swap"
                      >
                        <div className="flex items-center gap-3 min-w-0">
                          <div
                            className="mono font-bold text-center flex items-center justify-center rounded"
                            style={{
                              background: "rgba(244,241,232,0.1)",
                              border: `1px solid ${C.border}`,
                              color: C.amber,
                              fontSize: 14,
                              width: 32,
                              height: 32,
                              flexShrink: 0
                            }}
                          >
                            {p.number}
                          </div>
                          <div className="min-w-0">
                            <div className="truncate font-semibold" style={{ color: C.cream, fontSize: 13 }}>{dispName}</div>
                            {dispName !== p.name && (
                              <div className="truncate opacity-60" style={{ fontSize: 10, color: C.sage }}>{p.name}</div>
                            )}
                          </div>
                        </div>

                        <div className="flex items-center gap-2 flex-shrink-0">
                          <span
                            className="rounded px-2 py-0.5 font-bold"
                            style={{ fontSize: 10, background: hexToRgba(groupColor, 0.2), color: groupColor, border: `1px solid ${hexToRgba(groupColor, 0.4)}` }}
                          >
                            {p.rawPosition || p.position}
                          </span>
                          <button
                            type="button"
                            className="oswald"
                            style={{
                              fontSize: 11,
                              padding: "4px 8px",
                              borderRadius: 5,
                              background: isSelected ? C.amber : "rgba(244,241,232,0.12)",
                              color: isSelected ? C.ink : C.cream,
                              border: "none",
                              cursor: "pointer",
                              fontWeight: 700
                            }}
                          >
                            {isSelected ? "Tap Pitch" : "⇄ Swap"}
                          </button>
                        </div>
                      </div>
                    );
                  })
                )}
              </div>
            </div>
          </div>
        </div>
      </div>
    );
}


    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<FormationBuilder />);
  </script>
</body>

</html>
