function useFootballForumRoster(collectionName) {
  const [rows, setRows] = useState([]);
  useEffect(() => {
    const unsub = db.collection(collectionName).onSnapshot((snap) => {
      const players = snap.docs.map((doc) => {
        const d = doc.data();
        return `${d.number || "-"}, ${d.name || ""}, ${d.position || "ST"}`;
      });
      setRows(players.join("\n"));
    });
    return () => unsub();
  }, [collectionName]);
  return rows;
}
============================================================================ */

function assignToFormation(players, slots) {
  const starters = players.filter(p => p.type === "start");
  const bench = players.filter(p => p.type !== "start");

  const primaryPool = starters.length ? [...starters] : [...players];
  const secondaryPool = starters.length ? [...bench] : [];

  const findMatchIndex = (pool, slotCode) => {
    if (!pool || !pool.length) return -1;
    let idx = pool.findIndex((p) => p.canonical === slotCode);
    if (idx !== -1) return idx;

    if (slotCode === "CDM") idx = pool.findIndex((p) => p.canonical === "CM" || p.canonical === "CAM");
    else if (slotCode === "CM") idx = pool.findIndex((p) => p.canonical === "CDM" || p.canonical === "CAM" || p.canonical === "RM" || p.canonical === "LM");
    else if (slotCode === "CAM") idx = pool.findIndex((p) => p.canonical === "CM" || p.canonical === "CF");
    else if (slotCode === "ST") idx = pool.findIndex((p) => p.canonical === "CF" || p.canonical === "LW" || p.canonical === "RW");
    else if (slotCode === "CF") idx = pool.findIndex((p) => p.canonical === "ST");
    else if (slotCode === "LB") idx = pool.findIndex((p) => p.canonical === "LWB");
    else if (slotCode === "RB") idx = pool.findIndex((p) => p.canonical === "RWB");
    else if (slotCode === "LWB") idx = pool.findIndex((p) => p.canonical === "LB" || p.canonical === "LM");
    else if (slotCode === "RWB") idx = pool.findIndex((p) => p.canonical === "RB" || p.canonical === "RM");
    else if (slotCode === "LW") idx = pool.findIndex((p) => p.canonical === "LM");
    else if (slotCode === "RW") idx = pool.findIndex((p) => p.canonical === "RM");
    else if (slotCode === "LM") idx = pool.findIndex((p) => p.canonical === "LW");
    else if (slotCode === "RM") idx = pool.findIndex((p) => p.canonical === "RW");
    if (idx !== -1) return idx;

    const group = GROUP[slotCode] || "MID";
    const side = SIDE[slotCode] || "C";
    idx = pool.findIndex((p) => p.group === group && p.side === side);
    if (idx !== -1) return idx;

    idx = pool.findIndex((p) => p.group === group);
    return idx;
  };

  const filled = slots.map((slot) => {
    let idx = findMatchIndex(primaryPool, slot.code);
    let fromPrimary = true;

    if (idx === -1 && secondaryPool.length > 0) {
      idx = findMatchIndex(secondaryPool, slot.code);
      if (idx !== -1) fromPrimary = false;
    }

    if (idx === -1) {
      if (primaryPool.length > 0) { fromPrimary = true; idx = 0; }
      else if (secondaryPool.length > 0) { fromPrimary = false; idx = 0; }
    }

    if (idx === -1) return { slot, player: null };
    const player = fromPrimary ? primaryPool.splice(idx, 1)[0] : secondaryPool.splice(idx, 1)[0];
    return { slot, player };
  });

  const remainingSubs = [...primaryPool, ...secondaryPool];
  const order = { GK: 0, DEF: 1, MID: 2, FWD: 3 };
  remainingSubs.sort((a, b) => (order[a.group] - order[b.group]) || (a.name || '').localeCompare(b.name || ''));

  return { filled, subs: remainingSubs };
}

function FormationBuilder() {
  const [manualPlayers, setManualPlayers] = useState([]);
  const [formationKey, setFormationKey] = useState("4-3-3");
  const [showZones, setShowZones] = useState(true);
  const [showThirds, setShowThirds] = useState(false);
  const [isFullscreen, setIsFullscreen] = useState(false);
  const LINE_GROUPS = ["GK", "DEF", "MID", "FWD"];
  const [activeLines, setActiveLines] = useState(LINE_GROUPS);
  const [ballPos, setBallPos] = useState({ x: 50, y: 50 });
  const [panelOpen, setPanelOpen] = useState(true);
  const [customPos, setCustomPos] = useState({});
  const [dragKey, setDragKey] = useState(null);
  const [syncInfo, setSyncInfo] = useState("");
  const pitchRef = useRef(null);
  const [pitchHeight, setPitchHeight] = useState(null);
  const [showChat, setShowChat] = useState(() => {
    try { return localStorage.getItem("cms_fb_chat") !== "hidden"; } catch(e) { return true; }
  });
  const [chatMsgs, setChatMsgs] = useState([]);
  const [isCoach, setIsCoach] = useState(false);
  const [myChatId, setMyChatId] = useState({ name: 'Visitor', role: 'member' });
  const [chatInputText, setChatInputText] = useState('');
  const chatMessagesEndRef = useRef(null);

  // ---------- Exact Match XI slot data (the source of truth for pitch placement) ----------
  // exactStarters[i] lines up 1:1 with FORMATIONS[syncedFormationKey][i] — this is what
  // guarantees the pitch always matches Match XI exactly, with no re-calculation/mismatch.
  const [exactStarters, setExactStarters] = useState(null);
  const [exactSubs, setExactSubs] = useState(null);
  const [syncedFormationKey, setSyncedFormationKey] = useState(null);
  const [isDirty, setIsDirty] = useState(false); // true once the roster is hand-edited

  const reportHeight = () => {
    try {
      if (window.parent && window.parent !== window) {
        const h = document.documentElement.scrollHeight;
        window.parent.postMessage({ type: "ff-height", height: h }, "*");
      }
    } catch (e) {}
  };

  // Builds a pitch layout (x/y per slot) for ANY formation given just its role/count
  // definition (e.g. [{r:'GK',n:1},{r:'DEF',n:4},{r:'MID',n:4},{r:'FWD',n:2}]) — this is
  // what lets custom formations from Match XI render here even though they're not one of
  // the 6 built-in shapes.
  const autoLayoutFormation = (def) => {
    const roleCode = { GK: "GK", DEF: "CB", MID: "CM", FWD: "ST" };
    const lines = (def || []).filter((l) => l && l.n > 0);
    const outfield = lines.length - 1;
    const slots = [];
    lines.forEach((line, li) => {
      let y;
      if (li === 0) y = 93;
      else if (outfield <= 1) y = 45;
      else y = 76 - (li - 1) * (64 / (outfield - 1));
      const n = line.n;
      for (let i = 0; i < n; i++) {
        const x = 8 + (84 / (n + 1)) * (i + 1);
        const code = roleCode[line.r] || "CM";
        slots.push({ code, label: line.lbl || code, x, y });
      }
    });
    return slots;
  };

  // ---------- Sync roster from the Football Forum parent app (Match XI: playing 11 + subs + management) ----------
  const applySyncPayload = (data) => {
    if (!data) return;
    if (data.formation && !FORMATIONS[data.formation] && data.formationDef) {
      FORMATIONS[data.formation] = autoLayoutFormation(data.formationDef);
    }
    if (data.customPos && typeof data.customPos === "object") {
      setCustomPos(data.customPos);
    }
    if (data.ballPos && typeof data.ballPos === "object" && data.ballPos.x != null) {
      setBallPos(data.ballPos);
    }
    if (data.formation && FORMATIONS[data.formation]) {
      setFormationKey(data.formation);
    }
    if (data.starters) {
      // Exact per-slot data from a saved Match XI squad — preserves placement exactly.
      setExactStarters(data.starters);
      setExactSubs(data.subs || []);
      setSyncedFormationKey(data.formation && FORMATIONS[data.formation] ? data.formation : null);
      const startRows = [];
      data.starters.forEach((p) => { if (p) startRows.push({ ...p, type: "start" }); });
      const subRows = (data.subs || []).map((p) => ({ ...p, type: "sub" }));
      const flat = [...startRows, ...subRows];
      setManualPlayers(flat.map((p) => ({
        id: p.id || `sync-${Math.random().toString(36).slice(2, 8)}`,
        name: p.name || "",
        number: (p.number != null && p.number !== "") ? String(p.number) : ((p.jersey != null && p.jersey !== "") ? String(p.jersey) : "-"),
        position: p.position || "ST",
        type: p.type,
      })));
    } else {
      // No saved Match XI squad — fell back to the full player database (flat list only).
      // Split it the same way the pitch would: first N (formation size) as Playing XI, rest as Substitutes.
      setExactStarters(null);
      setExactSubs(null);
      setSyncedFormationKey(null);
      const startCount = (FORMATIONS[data.formation || formationKey] || FORMATIONS["4-3-3"]).length;
      const incoming = (data.players || []).map((p, idx) => ({
        id: p.id || `sync-${Math.random().toString(36).slice(2, 8)}`,
        name: p.name || "",
        number: (p.number != null && p.number !== "") ? String(p.number) : ((p.jersey != null && p.jersey !== "") ? String(p.jersey) : "-"),
        position: p.position || "ST",
        type: idx < startCount ? "start" : "sub",
      }));
      setManualPlayers(incoming);
    }
    const incomingMgmt = (data.management || []).map((m) => ({
      id: m.id || `mg-${Math.random().toString(36).slice(2, 8)}`,
      name: m.name || "",
      role: m.role || "Other",
    }));
    setManagement(incomingMgmt.length ? incomingMgmt : [{ id: "mg-1", name: "", role: "Head Coach" }]);
    setIsDirty(false);
    setPanelOpen(true);
    setSyncInfo(data.source || "Synced from Football Forum");
    setTimeout(reportHeight, 50);
    setTimeout(reportHeight, 300);
  };

  useEffect(() => {
    const handleMessage = (e) => {
      const data = e.data;
      if (!data || typeof data !== "object") return;
      if (data.type === "ff-sync") applySyncPayload(data);
      if (data.type === "ff-chat-sync") {
        if (Array.isArray(data.msgs)) setChatMsgs(data.msgs);
        if (typeof data.isCoach === "boolean") setIsCoach(data.isCoach);
        if (data.currentId) setMyChatId(data.currentId);
        setTimeout(() => {
          if (chatMessagesEndRef.current) {
            chatMessagesEndRef.current.scrollIntoView({ behavior: 'smooth' });
          }
        }, 50);
      }
    };
    window.addEventListener("message", handleMessage);
    // First load cached team formation from localStorage if available
    try {
      const cached = localStorage.getItem('ems_active_formation_payload');
      if (cached) {
        const parsed = JSON.parse(cached);
        if (parsed && typeof parsed === 'object') {
          applySyncPayload(parsed);
        }
      }
    } catch (e) {}

    // Let the parent / opener app know we're mounted and ready to receive the roster
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "ff-ready" }, "*");
      }
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ type: "ff-ready" }, "*");
      }
    } catch (e) {}
    reportHeight();
    const ro = new ResizeObserver(() => reportHeight());
    ro.observe(document.documentElement);
    window.addEventListener("resize", reportHeight);
    const t1 = setTimeout(reportHeight, 300);
    const t2 = setTimeout(reportHeight, 1000);
    return () => {
      window.removeEventListener("message", handleMessage);
      window.removeEventListener("resize", reportHeight);
      ro.disconnect();
      clearTimeout(t1);
      clearTimeout(t2);
    };
  }, []);

  const requestResync = () => {
    try {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: "ff-request-sync" }, "*");
      }
      if (window.opener && !window.opener.closed) {
        window.opener.postMessage({ type: "ff-request-sync" }, "*");
      }
    } catch (e) {}
    try {
      const cached = localStorage.getItem('ems_active_formation_payload');
      if (cached) {
        const parsed = JSON.parse(cached);
        if (parsed && typeof parsed === 'object') {
          applySyncPayload(parsed);
        }
      }
    } catch (e) {}
  };

  const toggleFullscreen = () => {
    const el = document.documentElement;
    if (!document.fullscreenElement) {
      (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el);
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || (() => {})).call(document);
    }
  };

  useEffect(() => {
    const onFsChange = () => setIsFullscreen(!!document.fullscreenElement);
    document.addEventListener("fullscreenchange", onFsChange);
    document.addEventListener("webkitfullscreenchange", onFsChange);
    return () => {
      document.removeEventListener("fullscreenchange", onFsChange);
      document.removeEventListener("webkitfullscreenchange", onFsChange);
    };
  }, []);

  const toggleChatVisibility = () => {
    setShowChat(prev => {
      const next = !prev;
      try { localStorage.setItem("cms_fb_chat", next ? "visible" : "hidden"); } catch(e) {}
      return next;
    });
  };

  useEffect(() => {
    const updatePitchHeight = () => {
      if (pitchRef.current) {
        const h = pitchRef.current.getBoundingClientRect().height;
        if (h > 50) setPitchHeight(Math.round(h));
      }
    };
    updatePitchHeight();
    const ro = new ResizeObserver(() => {

    const t1 = setTimeout(updatePitchHeight, 50);
    const t2 = setTimeout(updatePitchHeight, 250);
    const t3 = setTimeout(updatePitchHeight, 600);
    return () => {
      ro.disconnect();
      window.removeEventListener("resize", updatePitchHeight);
      document.removeEventListener("fullscreenchange", updatePitchHeight);
      document.removeEventListener("webkitfullscreenchange", updatePitchHeight);
      clearTimeout(t1);

              {/* floating ball */}
              <div
                onPointerDown={(e) => {
                  e.preventDefault();
                  setDragKey("ball");
                }}
                onTouchStart={(e) => {
                  e.preventDefault();
                  setDragKey("ball");
                }}
                className="absolute"
                style={{
                  left: `${ballPos.x}%`,
                  top: `${ballPos.y}%`,
                  transform: "translate(-50%,-50%)",
                  cursor: dragKey === "ball" ? "grabbing" : "grab",
                  zIndex: 30,
                  userSelect: "none",
                }}
              >
                <svg width="28" height="28" viewBox="0 0 100 100" style={{ filter: "drop-shadow(0 2px 3px rgba(0,0,0,0.5))", pointerEvents: "none" }}>
                  <defs>
                    <clipPath id="ballClip">
                      <circle cx="50" cy="50" r="47" />
                    </clipPath>
                  </defs>
                  <circle cx="50" cy="50" r="47" fill="#FFFFFF" stroke="#111111" strokeWidth="3" />
                  <g clipPath="url(#ballClip)">
                    <g stroke="#111111" strokeWidth="1.6" fill="none">
                      <line x1="50" y1="36" x2="50" y2="3" />
                      <line x1="63.31" y1="45.67" x2="94.7" y2="35.47" />
                      <line x1="58.23" y1="61.33" x2="77.62" y2="88.03" />
                      <line x1="41.77" y1="61.33" x2="22.38" y2="88.03" />
                      <line x1="36.69" y1="45.67" x2="5.3" y2="35.47" />
                    </g>
                    <g fill="#111111" stroke="#111111" strokeWidth="1.2" strokeLinejoin="round">
                      <polygon points="50,36 63.31,45.67 58.23,61.33 41.77,61.33 36.69,45.67" />
                      <polygon points="50,1 58.56,7.22 55.29,17.29 44.71,17.29 41.44,7.22" />
                      <polygon points="88.04,28.64 96.6,34.86 93.33,44.93 82.75,44.93 79.48,34.86" />
                      <polygon points="73.51,73.36 82.07,79.58 78.8,89.65 68.22,89.65 64.95,79.58" />
                      <polygon points="26.49,73.36 35.05,79.58 31.78,89.65 21.2,89.65 17.93,79.58" />
                      <polygon points="11.96,28.64 20.52,34.86 17.25,44.93 6.67,44.93 3.4,34.86" />
                    </g>
                  </g>
                </svg>
              </div>
            </div>
          </div>

          {/* RIGHT: THE LIVE TEAM CHAT BOX (Exact equal length to Pitch) */}
          {showChat && (
          <div
            className="no-print flex flex-col"
            style={{
              background: C.panel,
              border: `1px solid ${C.border}`,
              borderRadius: 10,
              overflow: "hidden",
              height: pitchHeight ? `${pitchHeight}px` : "100%",
              maxHeight: pitchHeight ? `${pitchHeight}px` : "none",
              minHeight: pitchHeight ? `${pitchHeight}px` : "100%",
              boxSizing: "border-box"
            }}
          >
            {/* Chat Header */}
            <div className="flex items-center justify-between px-4 py-3 border-b flex-shrink-0" style={{ borderColor: C.border, background: "rgba(19,43,28,0.85)" }}>
              <div className="flex items-center gap-2">
                <span style={{ fontSize: 18 }}>💬</span>
                <div>
                  <div className="oswald" style={{ fontSize: 14, letterSpacing: "0.15em", color: C.cream, fontWeight: 700 }}>TEAM CHAT & NOTICES</div>
                  <div style={{ fontSize: 11, color: C.sage }}>
                    Posting as: <strong style={{ color: C.amber }}>{isCoach ? (myChatId.name || "Head Coach") : (myChatId.name || "Visitor")}</strong> {(!isCoach) && <button onClick={openIdentityModal} style={{ textDecoration: "underline", color: C.cream, marginLeft: 6, background: "none", border: "none", cursor: "pointer", fontSize: 11 }}>Change</button>}
                  </div>
                </div>
              </div>
              {isCoach && (
                <button
                  onClick={clearAllChat}
                  className="oswald"
                  style={{ fontSize: 11, color: "#E88A6D", background: "rgba(220,38,38,0.12)", border: "1px solid rgba(220,38,38,0.3)", borderRadius: 6, padding: "4px 8px", cursor: "pointer" }}
                >
                  🗑️ Clear
                </button>
              )}
            </div>

            {/* Pinned Notice Card */}
            {chatMsgs.find(m => m.pinned) && (() => {
              const pinnedMsg = chatMsgs.find(m => m.pinned);
              return (
                <div className="flex items-start gap-2 px-4 py-2 border-b flex-shrink-0" style={{ borderColor: C.border, background: "rgba(232,179,76,0.12)" }}>
                  <span style={{ fontSize: 15 }}>📌</span>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div className="oswald" style={{ fontSize: 10, letterSpacing: "0.1em", color: C.amber, fontWeight: 700 }}>PINNED ANNOUNCEMENT</div>
                    <div style={{ fontSize: 12, color: C.cream, wordBreak: "break-word" }}>{pinnedMsg.senderName} ({formatTime(pinnedMsg.createdAt)}): {pinnedMsg.text}</div>
                  </div>
                  {isCoach && (
                    <button onClick={() => togglePinMessage(pinnedMsg.id, true)} style={{ color: C.sage, background: "none", border: "none", cursor: "pointer", fontSize: 12 }}>✕</button>
                  )}
                </div>
              );
            })()}

            {/* Scrollable Messages Stream */}
            <div className="chat-scroll flex-1 overflow-y-auto p-4 flex flex-col gap-3" style={{ minHeight: 0 }}>
              {chatMsgs.length === 0 ? (
                <div className="m-auto text-center py-8" style={{ color: C.sage }}>
                  <div style={{ fontSize: 32, marginBottom: 6 }}>💬</div>
                  <div className="oswald" style={{ fontSize: 14, color: C.creamSoft }}>No messages yet</div>
                  <div style={{ fontSize: 11.5, marginTop: 4, opacity: 0.8 }}>Start a tactical discussion with the squad!</div>
                </div>
              ) : (
                chatMsgs.map((m) => {
                  const isMine = isCoach ? (m.senderRole === 'coach') : (m.senderName === myChatId.name);
                  const isCoachMsg = m.senderRole === 'coach';
                  const roleLabel = (m.senderRole || 'member').toUpperCase();
                  const timeStr = formatTime(m.createdAt);
                  let avatar = '💬';
                  if (isCoachMsg) avatar = '👑';
                  else if (m.senderRole === 'player') avatar = '⚽';
                  else if (m.senderRole === 'staff') avatar = '🧑‍💼';

                  return (
                    <div key={m.id} className={`flex gap-2.5 items-start ${isMine ? 'flex-row-reverse self-end' : 'self-start'}`} style={{ maxWidth: "88%" }}>
                      <div className="flex items-center justify-center rounded-full flex-shrink-0" style={{ width: 28, height: 28, background: "rgba(244,241,232,0.1)", border: `1px solid ${C.border}`, fontSize: 12 }}>
                        {avatar}
                      </div>
                      <div className="flex flex-col gap-0.5" style={{ alignItems: isMine ? "flex-end" : "flex-start" }}>
                        <div className="flex items-center gap-1.5" style={{ fontSize: 10, color: C.sage }}>
                          <span style={{ fontWeight: 700, color: C.cream }}>{m.senderName}</span>
                          <span className="mono rounded px-1" style={{ fontSize: 8.5, background: isCoachMsg ? "rgba(232,179,76,0.2)" : "rgba(244,241,232,0.1)", color: isCoachMsg ? C.amber : C.sage }}>{roleLabel}</span>
                        </div>
                        <div className="rounded-xl px-3 py-2 relative group" style={{
                          background: isMine ? "#1A5C1A" : "rgba(30,77,43,0.6)",
                          border: `1px solid ${isMine ? "#237A23" : C.border}`,
                          color: C.cream,
                          fontSize: 13,
                          lineHeight: 1.35,
                          wordBreak: "break-word",
                          borderTopLeftRadius: !isMine ? 2 : 12,
                          borderTopRightRadius: isMine ? 2 : 12,
                        }}>
                          {isCoach && (
                            <div className="hidden group-hover:flex absolute -top-3 right-1 gap-1 px-1.5 py-0.5 rounded" style={{ background: C.panel, border: `1px solid ${C.border}`, fontSize: 10 }}>
                              <button onClick={() => togglePinMessage(m.id, !!m.pinned)} style={{ color: C.amber, background: "none", border: "none", cursor: "pointer", fontSize: 10 }}>{m.pinned ? '📌 Unpin' : '📌 Pin'}</button>
                              <button onClick={() => deleteChatMessage(m.id)} style={{ color: "#E88A6D", background: "none", border: "none", cursor: "pointer", fontSize: 10 }}>🗑️</button>
                            </div>
                          )}
                          <div>{m.text}</div>
                          <div style={{ fontSize: 9, opacity: 0.6, marginTop: 3, textAlign: "right" }}>{timeStr} {m.pinned ? '📌' : ''}</div>
                        </div>
                      </div>
                    </div>
                  );
                })
              )}
              <div ref={chatMessagesEndRef} />
            </div>

            {/* Message Input Row */}
            <form onSubmit={sendChatMessage} className="flex gap-2 p-3 border-t flex-shrink-0" style={{ borderColor: C.border, background: "rgba(19,43,28,0.95)" }}>
              <input
                type="text"
                placeholder={isCoach ? "Post a message as Coach…" : "Type a message to chat with the team…"}
                value={chatInputText}
                onChange={(e) => setChatInputText(e.target.value)}
                className="flex-1 px-3.5 py-2 rounded-full text-sm outline-none"
                style={{ background: C.bg, border: `1px solid ${C.border}`, color: C.cream }}
              />
              <button
                type="submit"
                className="w-9 h-9 rounded-full flex items-center justify-center text-white flex-shrink-0 cursor-pointer hover:scale-105 transition-transform"
                style={{ background: "#1A5C1A", border: "none", boxShadow: "0 2px 8px rgba(0,0,0,0.3)" }}
                title="Send"
              >
                ➤
              </button>
            </form>
          </div>
          )}
        </div>

        {/* GAME CHANGERS + MANAGEMENT SECTION (Below the Pitch & Chat stage) */}
        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
          {/* Substitutes */}
          <div>
            <div className="oswald" style={{ fontSize: 12, letterSpacing: "0.3em", color: C.sage, marginBottom: 8 }}>
              GAME CHANGERS · {subs.length}
            </div>
            {subs.length === 0 ? (
              <div style={{ fontSize: 14, color: "rgba(143,191,159,0.7)", fontStyle: "italic", background: C.panel, border: `1px solid ${C.border}`, borderRadius: 6, padding: "12px 16px" }}>No players left on the bench.</div>
            ) : (
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                {subs.map((p) => (
                  <div
                    key={p.id}
                    className="flex items-center gap-3"
                    style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 6, padding: "8px 12px" }}
                  >
                    <div className="mono font-bold text-center" style={{ color: C.amber, fontSize: 14, width: 24 }}>{p.number}</div>
                    <div style={{ minWidth: 0 }}>
                      <div className="truncate" style={{ color: C.cream, fontSize: 13 }}>{p.name}</div>
                      <div style={{ fontSize: 10, color: C.sage, letterSpacing: "0.02em" }}>{p.rawPosition}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>

          {/* Management / Staff */}
          <div>
            <div className="oswald" style={{ fontSize: 12, letterSpacing: "0.3em", color: C.sage, marginBottom: 8 }}>
              MANAGEMENT / STAFF · {managementFilled.length}
            </div>
            {managementFilled.length === 0 ? (
              <div style={{ fontSize: 14, color: "rgba(143,191,159,0.7)", fontStyle: "italic", background: C.panel, border: `1px solid ${C.border}`, borderRadius: 6, padding: "12px 16px" }}>No management staff assigned.</div>
            ) : (
              <div className="grid grid-cols-2 sm:grid-cols-3 gap-2">
                {managementFilled.map((m) => (
                  <div
                    key={m.id}
                    className="flex items-center gap-3"
                    style={{ background: C.panel, border: `1px solid ${C.border}`, borderRadius: 6, padding: "8px 12px" }}
                  >
                    <div
                      className="flex items-center justify-center"
                      style={{ width: 26, height: 26, borderRadius: "50%", background: "rgba(139,95,191,0.25)", border: `1px solid ${ZONE_COLORS.GK}`, flexShrink: 0 }}
                    >
                      <span style={{ fontSize: 12 }}>👔</span>
                    </div>
                    <div style={{ minWidth: 0 }}>
                      <div className="truncate" style={{ color: C.cream, fontSize: 13 }}>{m.name}</div>
                      <div style={{ fontSize: 10, color: C.sage, letterSpacing: "0.02em" }}>{m.role}</div>
                    </div>
                  </div>
                ))}
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<FormationBuilder />);
</script>
</body>
</html>
